<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обучение AI ассистента</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f5f5f5; display: flex; justify-content: center;
         padding: 40px 16px; min-height: 100vh; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
          padding: 32px; width: 100%; max-width: 800px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #1a1a1a; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
  textarea, input[type=text], select {
    width: 100%; border: 1px solid #ddd; border-radius: 8px; padding: 10px 12px;
    font-size: 14px; outline: none; transition: border .2s;
    font-family: inherit; background: #fff; }
  textarea { resize: vertical; line-height: 1.5; }
  textarea:focus, input:focus, select:focus { border-color: #4f46e5; }
  .btn { border: none; border-radius: 8px; padding: 11px 20px; font-size: 14px;
         font-weight: 500; cursor: pointer; transition: background .2s; }
  .btn-primary { background: #4f46e5; color: #fff; }
  .btn-primary:hover { background: #4338ca; }
  .btn-primary:disabled { background: #a5b4fc; cursor: not-allowed; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-success:disabled { background: #86efac; cursor: not-allowed; }
  .btn-sm { padding: 6px 12px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .btn-danger:hover { background: #fecaca; }
  .chunks-section { margin-top: 28px; display: none; }
  .chunks-header h2 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
  .chunk { border: 1px solid #e5e7eb; border-radius: 10px; padding: 18px; margin-bottom: 14px; position: relative; }
  .chunk-num { font-size: 11px; font-weight: 700; color: #9ca3af; text-transform: uppercase;
               letter-spacing: .5px; margin-bottom: 12px; }
  .chunk label { font-size: 12px; color: #777; margin-bottom: 4px; margin-top: 10px; }
  .chunk label:first-of-type { margin-top: 0; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
  .delete-btn { position: absolute; top: 14px; right: 14px; }
  .upload-bar { margin-top: 20px; }
  .result-msg { font-size: 14px; padding: 12px 16px; border-radius: 8px; display: none; margin-top: 14px; line-height: 1.5; }
  .result-msg.success { background: #dcfce7; color: #16a34a; }
  .result-msg.error { background: #fee2e2; color: #dc2626; }
  .add-btn-row { margin-top: 10px; }
  .links { font-size: 13px; margin-bottom: 20px; }
  .links a { color: #4f46e5; text-decoration: none; margin-right: 16px; }
  .links a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <h1>📚 Обучение AI ассистента</h1>
  <p class="subtitle">Вставьте статью, FAQ или типичный кейс — AI разобьёт его на Q&A пары</p>
  <div class="links"><a href="/test">Тест автоответов</a><a href="/kb">База знаний</a></div>

  <label for="article">Статья / FAQ / Кейс вопрос-ответ</label>
  <textarea id="article" rows="7" placeholder="Вставьте текст сюда..."></textarea>
  <div style="margin-top:12px">
    <button class="btn btn-primary" id="chunkBtn" onclick="chunkText()">🤖 Обучить AI ассистента</button>
  </div>

  <div class="chunks-section" id="chunksSection">
    <div class="chunks-header"><h2>Результат — проверьте и отредактируйте</h2></div>
    <div id="chunksList"></div>
    <div class="add-btn-row">
      <button class="btn btn-sm" onclick="addChunk()" style="background:#f3f4f6;color:#374151">+ Добавить пару</button>
    </div>
    <div class="upload-bar">
      <button class="btn btn-success" id="uploadBtn" onclick="uploadChunks()">⬆️ Загрузить в базу данных</button>
    </div>
    <div class="result-msg" id="resultMsg"></div>
  </div>
</div>

<script>
let chunks = [];

async function chunkText() {
  const text = document.getElementById('article').value.trim();
  if (!text) return;
  const btn = document.getElementById('chunkBtn');
  btn.disabled = true; btn.textContent = 'Обрабатываю...';
  try {
    const res = await fetch('/api/chunk', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    const data = await res.json();
    chunks = (data.chunks || []).map(c => ({
      question: c.question || '', answer: c.answer || '',
      category: c.category || '', subcategory: c.subcategory || '',
      audience: c.audience || 'оба'
    }));
    renderChunks();
    document.getElementById('chunksSection').style.display = 'block';
    document.getElementById('resultMsg').style.display = 'none';
  } catch(e) { alert('Ошибка: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '🤖 Обучить AI ассистента'; }
}

function audienceOpts(val) {
  return ['оба','исполнитель','заказчик'].map(v =>
    `<option value="${v}"${v===val?' selected':''}>${v}</option>`
  ).join('');
}

function renderChunks() {
  const list = document.getElementById('chunksList');
  list.innerHTML = chunks.map((c, i) => `
    <div class="chunk" id="chunk-${i}">
      <div class="chunk-num">Пара #${i+1}</div>
      <button class="btn btn-sm btn-danger delete-btn" onclick="removeChunk(${i})">✕</button>
      <label>Вопрос</label>
      <textarea rows="2" oninput="chunks[${i}].question=this.value">${esc(c.question)}</textarea>
      <label>Ответ</label>
      <textarea rows="3" oninput="chunks[${i}].answer=this.value">${esc(c.answer)}</textarea>
      <div class="row2">
        <div>
          <label>Категория *</label>
          <input type="text" value="${esc(c.category)}" oninput="chunks[${i}].category=this.value" placeholder="Выплаты, Аккаунт...">
        </div>
        <div>
          <label>Подкатегория</label>
          <input type="text" value="${esc(c.subcategory)}" oninput="chunks[${i}].subcategory=this.value" placeholder="необязательно">
        </div>
        <div>
          <label>Аудитория *</label>
          <select onchange="chunks[${i}].audience=this.value">${audienceOpts(c.audience)}</select>
        </div>
      </div>
    </div>`).join('');
}

function addChunk() {
  chunks.push({question:'', answer:'', category:'', subcategory:'', audience:'оба'});
  renderChunks();
  document.getElementById('chunk-'+(chunks.length-1)).scrollIntoView({behavior:'smooth'});
}

function removeChunk(i) { chunks.splice(i,1); renderChunks(); }

async function uploadChunks() {
  const payload = chunks.filter(c => c.question.trim() && c.answer.trim() && c.category.trim());
  if (!payload.length) { alert('Заполните вопрос, ответ и категорию для каждой пары'); return; }
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.textContent = 'Загружаю...';
  try {
    const res = await fetch('/api/upload-chunks', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({chunks: payload})
    });
    const data = await res.json();
    const msg = document.getElementById('resultMsg');
    msg.style.display = 'block';
    if (data.errors && data.errors.length) {
      msg.className = 'result-msg error';
      msg.textContent = `Загружено: ${data.uploaded}. Ошибки: ${data.errors.join(' | ')}`;
    } else {
      msg.className = 'result-msg success';
      msg.textContent = `Успешно загружено ${data.uploaded} пар + вариации вопросов в базу знаний!`;
      chunks = []; renderChunks();
      document.getElementById('article').value = '';
    }
  } catch(e) { alert('Ошибка: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = '⬆️ Загрузить в базу данных'; }
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
