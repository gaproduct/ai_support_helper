<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База знаний AI ассистента</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #f5f5f5; min-height: 100vh; padding: 40px 16px; }
  .header { max-width: 860px; margin: 0 auto 24px; display: flex;
            justify-content: space-between; align-items: flex-end; }
  .header h1 { font-size: 20px; font-weight: 600; color: #1a1a1a; }
  .header .meta { font-size: 13px; color: #888; }
  .search-row { max-width: 860px; margin: 0 auto 20px; }
  .search-row input { width: 100%; border: 1px solid #ddd; border-radius: 8px;
                      padding: 11px 14px; font-size: 14px; outline: none;
                      transition: border .2s; background: #fff; }
  .search-row input:focus { border-color: #4f46e5; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.07);
          padding: 20px 24px; max-width: 860px; margin: 0 auto 12px; }
  .card-num { font-size: 11px; font-weight: 600; color: #9ca3af; text-transform: uppercase;
              letter-spacing: .5px; margin-bottom: 8px; }
  .question { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px;
              line-height: 1.4; }
  .answer { font-size: 14px; color: #4b5563; line-height: 1.6; white-space: pre-wrap; }
  .empty { text-align: center; color: #9ca3af; padding: 60px 0; font-size: 15px; }
  .loading { text-align: center; color: #9ca3af; padding: 60px 0; font-size: 15px; }
  .links { max-width: 860px; margin: 0 auto 20px; display: flex; gap: 16px; }
  .links a { font-size: 13px; color: #4f46e5; text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .error-msg { max-width: 860px; margin: 0 auto 16px; background: #fee2e2;
               color: #dc2626; border-radius: 8px; padding: 12px 16px; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📖 База знаний AI ассистента</h1>
  </div>
  <div class="meta" id="countLabel">Загрузка...</div>
</div>

<div class="links">
  <a href="/test">← Тест автоответов</a>
  <a href="/train">← Обучить ассистента</a>
</div>

<div class="search-row">
  <input type="text" id="search" placeholder="Поиск по вопросам и ответам..." oninput="filterArticles()">
</div>

<div id="errorMsg" class="error-msg" style="display:none"></div>
<div id="list"></div>

<script>
let allArticles = [];

async function load() {
  const res = await fetch('/api/kb-articles');
  const data = await res.json();
  if (data.error) {
    document.getElementById('errorMsg').style.display = 'block';
    document.getElementById('errorMsg').textContent = 'Ошибка: ' + data.error;
  }
  allArticles = data.articles || [];
  render(allArticles);
}

function filterArticles() {
  const q = document.getElementById('search').value.toLowerCase();
  if (!q) { render(allArticles); return; }
  render(allArticles.filter(a =>
    a.question.toLowerCase().includes(q) || a.answer.toLowerCase().includes(q)
  ));
}

function render(articles) {
  const list = document.getElementById('list');
  document.getElementById('countLabel').textContent = articles.length + ' статей';
  if (!articles.length) {
    list.innerHTML = '<div class="empty">Ничего не найдено</div>';
    return;
  }
  list.innerHTML = articles.map((a, i) => `
    <div class="card">
      <div class="card-num">#${a.id}</div>
      <div class="question">${esc(a.question)}</div>
      <div class="answer">${esc(a.answer)}</div>
    </div>
  `).join('');
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

load();
</script>
</body>
</html>
